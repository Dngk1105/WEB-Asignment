<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD | IT4409</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18, ReactDOM, and Babel Standalone via CDN -->

  <style>
    /* ==========================================================================
       CSS Variables & Reset
       ========================================================================== */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      
      --success: #10b981;
      --success-hover: #059669;
      --success-light: #ecfdf5;
      
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fef2f2;
      
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      
      --radius-sm: 6px;

      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'CaskaydiaCove Nerd Font Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--slate-50);
      color: var(--slate-800);
      line-height: 1.5;
      min-height: 100vh;

      flex-direction: column;
    }

    /* ==========================================================================
       Layout Components
       ========================================================================== */

      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px 48px;
      flex: 1;

    }

    /* Top Navigation bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--slate-200);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;

    .back-link:hover {

    .nav-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--slate-500);
      background: var(--slate-100);
      padding: 4px 10px;

    /* App Header */
    .app-header {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--primary-light), #e0e7ff);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--slate-900);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header-subtitle {

    }

    .author-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;

    .author-name {

    .author-meta {

    /* Toolbar: SearchForm & AddUser */
    .toolbar {

      align-items: center;

    .search-box {

      flex: 1;

      min-width: 280px;

    .search-icon {

    .search-input {

      padding: 11px 40px 11px 40px;
      font-family: var(--font-sans);
      font-size: 0.95rem;

      border: 1px solid var(--slate-300);

    .search-clear-btn {

    .table-card {

    /* Action buttons in Table */
    .action-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

    .btn-action {

      border-radius: var(--radius-sm);
      border: 1px solid transparent;

      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;

    .btn-edit {
      background-color: #eff6ff;
      color: var(--primary);
      border-color: #bfdbfe;
    }

    .btn-edit:hover {

      color: #ffffff;
      border-color: var(--primary);

    .btn-delete {

      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-delete:hover {
      background-color: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }

    /* Loading & Empty states */
    .loading-state, .error-state, .empty-state {
      padding: 60px 20px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--slate-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }

    .empty-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;

    }

    /* ==========================================================================
       Modal Form (AddUser & EditUser)
       ========================================================================== */
    .modal-overlay {

      left: 0;
      width: 100%;
      height: 100%;

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }

    .modal-content {
      background: #ffffff;
      border-radius: var(--radius-lg);

      border: 1px solid var(--slate-200);

    @keyframes slideUp {
      from { transform: translateY(16px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 10;

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--slate-900);
      display: flex;
      align-items: center;
      gap: 8px;

    .modal-close {

      font-size: 1.5rem;

      color: var(--slate-400);

    .modal-close:hover {

    }

    .modal-body {
      padding: 24px;
      display: flex;

      background-color: var(--slate-50);

      display: flex;
      justify-content: flex-end;
      gap: 12px;
      position: sticky;
      bottom: 0;

    }

    /* ==========================================================================
       Responsive Media Queries
       ========================================================================== */
    @media (max-width: 768px) {
      .app-container {
        padding: 16px 12px 32px;
      }

        flex-direction: column;
        align-items: flex-start;
      }

      .author-badge {
        align-items: flex-start;

      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      }

      }

      }

  </style>

<body>
  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ==========================================================================
       1. Component SearchForm
       - Nhận props: onChangeValue (chính là setKeyword từ App)
       - Xử lý sự kiện onChange trên ô input để cập nhật từ khóa tìm kiếm lên App
       ========================================================================== */
    function SearchForm({ onChangeValue }) {
      const [localValue, setLocalValue] = useState("");

      const handleChange = (e) => {
        const val = e.target.value;
        setLocalValue(val);
        onChangeValue(val);
      };

      const handleClear = () => {
        setLocalValue("");
        onChangeValue("");
      };

      return (
        <div className="search-box">
          <span className="search-icon">🔍</span>
          <input
            type="text"
            className="search-input"
            placeholder="Tìm theo Name hoặc Username..."
            value={localValue}
            onChange={handleChange}
          />
          {localValue && (
            <button
              type="button"
              className="search-clear-btn"
              onClick={handleClear}
              title="Xóa tìm kiếm"
            >
              ×
            </button>
          )}
        </div>
      );
    }

    /* ==========================================================================
       2. Component AddUser
       - Nhận props: onAdd (chính là setNewUser từ App)
       - Quản lý form nhập liệu Modal với cấu trúc lồng nhau (address: street, suite, city)
       - Deep copy khi cập nhật thuộc tính lồng
       - Validate bắt buộc có Name & Username
       - Sửa lỗi trong slide bài giảng: onClick={() => setAdding(false)} thay vì onClick={setAdding(false)}
       ========================================================================== */
    function AddUser({ onAdd }) {
      const [adding, setAdding] = useState(false);
      
      const emptyUser = {
        name: "",
        username: "",
        email: "",
        address: { street: "", suite: "", city: "" },
        phone: "",
        website: ""
      };

      const [user, setUser] = useState(emptyUser);

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (["street", "suite", "city"].includes(id)) {
          // Deep copy nested address object
          setUser({
            ...user,
            address: { ...user.address, [id]: value }
          });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = (e) => {
        if (e) e.preventDefault();
        
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }

        // Tạo deep copy đối tượng người dùng mới để truyền lên App
        const userToSubmit = {
          ...user,
          name: user.name.trim(),
          username: user.username.trim(),
          email: user.email.trim(),
          phone: user.phone.trim(),
          website: user.website.trim(),
          address: {
            street: user.address.street.trim(),
            suite: user.address.suite.trim(),
            city: user.address.city.trim()
          }
        };

        onAdd(userToSubmit);
        setUser(emptyUser);
        setAdding(false);
      };

      const handleCancel = () => {
        setUser(emptyUser);
        setAdding(false);
      };

      return (
        <div className="add-user-container">
          <button
            type="button"
            className="btn btn-primary"
            onClick={() => setAdding(true)}
          >
            <span className="btn-icon">+</span> Thêm người dùng
          </button>

          {adding && (
            <div className="modal-overlay" onClick={handleCancel}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">
                    <span>➕</span> Thêm người dùng mới
                  </h3>
                  <button
                    type="button"
                    className="modal-close"
                    onClick={handleCancel}
                    title="Đóng"
                  >
                    ×
                  </button>
                </div>

                <form onSubmit={handleAdd}>
                  <div className="modal-body">
                    <div className="form-grid">
                      <div className="form-group">
                        <label htmlFor="name">
                          Họ và tên (Name) <span className="req">*</span>
                        </label>
                        <input
                          id="name"
                          type="text"
                          required
                          placeholder="Ví dụ: Lê Văn Nam"
                          value={user.name}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="username">
                          Tên tài khoản (Username) <span className="req">*</span>
                        </label>
                        <input
                          id="username"
                          type="text"
                          required
                          placeholder="Ví dụ: namlv"
                          value={user.username}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="email">Email</label>
                        <input
                          id="email"
                          type="email"
                          placeholder="namlv@example.com"
                          value={user.email}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="phone">Số điện thoại</label>
                        <input
                          id="phone"
                          type="text"
                          placeholder="0912 345 678"
                          value={user.phone}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-section-title">Thông tin Địa chỉ</div>

                      <div className="form-group">
                        <label htmlFor="street">Đường / Phố (Street)</label>
                        <input
                          id="street"
                          type="text"
                          placeholder="1 Đại Cồ Việt"
                          value={user.address.street}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="suite">Phòng / Tòa (Suite)</label>
                        <input
                          id="suite"
                          type="text"
                          placeholder="Phòng 402, Nhà B1"
                          value={user.address.suite}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="city">Thành phố (City)</label>
                        <input
                          id="city"
                          type="text"
                          placeholder="Hà Nội"
                          value={user.address.city}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="website">Website</label>
                        <input
                          id="website"
                          type="text"
                          placeholder="namlv.dev"
                          value={user.website}
                          onChange={handleChange}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="modal-actions">
                    {/* Sửa chuẩn onClick={() => setAdding(false)} theo đúng yêu cầu */}
                    <button
                      type="button"
                      className="btn btn-secondary"
                      onClick={() => setAdding(false)}
                    >
                      Hủy
                    </button>
                    <button type="submit" className="btn btn-primary">
                      Thêm
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ==========================================================================
       3. Component ResultTable
       - Nhận props: keyword, user, onAdded
       - Tải dữ liệu ban đầu 10 users từ API https://jsonplaceholder.typicode.com/users bằng useEffect
       - Lọc dữ liệu theo keyword (tìm trong name & username)
       - Lắng nghe prop user thay đổi để thêm vào mảng users và gọi onAdded()
       - Chức năng Sửa (Edit) với Deep Copy để tránh biến đổi tham chiếu ngoài ý muốn
       - Chức năng Xóa (Delete) bằng removeUser(id)
       ========================================================================== */
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editing, setEditing] = useState(null);
      const [apiError, setApiError] = useState(null);

      // Tải dữ liệu 1 lần khi component mount
      useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
          })
          .then((data) => {
            setUsers(data);
            setLoading(false);
          })
          .catch((err) => {
            console.error("Lỗi khi tải dữ liệu người dùng:", err);
            setApiError("Không thể tải danh sách người dùng từ API. Vui lòng thử lại!");
            setLoading(false);
          });
      }, []);

      // Lắng nghe người dùng mới được thêm từ prop `user`
      useEffect(() => {
        if (user) {
          setUsers((prev) => {
            const nextId = prev.length > 0
              ? Math.max(...prev.map((u) => Number(u.id) || 0)) + 1
              : 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded();
        }
      }, [user]);

      // Kích hoạt form Sửa - Kỹ thuật Deep Copy lồng nhau
      function editUser(u) {
        setEditing({
          ...u,
          address: { ...(u.address || { street: "", suite: "", city: "" }) }
        });
      }

      // Xử lý thay đổi dữ liệu trong form Sửa
      const handleEditChange = (id, value) => {
        if (["street", "suite", "city"].includes(id)) {
          setEditing((prev) => ({
            ...prev,
            address: { ...prev.address, [id]: value }
          }));
        } else {
          setEditing((prev) => ({
            ...prev,
            [id]: value
          }));
        }
      };

      // Lưu sau khi chỉnh sửa
      function saveUser(e) {
        if (e) e.preventDefault();
        if (!editing.name.trim() || !editing.username.trim()) {
          alert("Vui lòng nhập Name và Username!");
          return;
        }

        setUsers((prev) =>
          prev.map((u) => (u.id === editing.id ? editing : u))
        );
        setEditing(null);
      }

      // Xóa người dùng trực tiếp khỏi danh sách
      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      // Lọc danh sách theo keyword
      const kw = (keyword || "").toLowerCase().trim();
      const filteredUsers = users.filter(
        (u) =>
          (u.name || "").toLowerCase().includes(kw) ||
          (u.username || "").toLowerCase().includes(kw)
      );

      return (
        <div className="table-card">
          <div className="table-card-header">
            <div className="table-stats">
              <span className="stats-badge">
                Tổng số: <strong>{users.length}</strong> người dùng
              </span>
              {kw && (
                <span className="stats-badge filtered">
                  Tìm thấy: <strong>{filteredUsers.length}</strong> kết quả
                </span>
              )}
            </div>
          </div>

          {loading ? (
            <div className="loading-state">
              <div className="spinner"></div>
              <p>Đang tải danh sách người dùng từ API JSONPlaceholder...</p>
            </div>
          ) : apiError ? (
            <div className="error-state">
              <p className="error-msg">{apiError}</p>
            </div>
          ) : (
            <div className="table-responsive">
              <table className="user-table">
                <thead>
                  <tr>
                    <th style={{ width: "64px" }}>ID</th>
                    <th>Họ và tên</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th>Số điện thoại</th>
                    <th style={{ width: "160px", textAlign: "center" }}>Thao tác</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredUsers.length > 0 ? (
                    filteredUsers.map((u) => (
                      <tr key={u.id}>
                        <td>
                          <span className="id-badge">#{u.id}</span>
                        </td>
                        <td className="user-name-cell">{u.name}</td>
                        <td>
                          <span className="username-tag">@{u.username}</span>
                        </td>
                        <td>
                          {u.email ? (
                            <a href={`mailto:${u.email}`} className="email-link">
                              {u.email}
                            </a>
                          ) : (
                            <span className="text-muted">—</span>
                          )}
                        </td>
                        <td className="address-cell">
                          {u.address && (u.address.street || u.address.suite || u.address.city) ? (
                            [u.address.street, u.address.suite, u.address.city]
                              .filter(Boolean)
                              .join(", ")
                          ) : (
                            <span className="text-muted">—</span>
                          )}
                        </td>
                        <td>{u.phone || <span className="text-muted">—</span>}</td>
                        <td>
                          <div className="action-buttons">
                            <button
                              type="button"
                              className="btn-action btn-edit"
                              onClick={() => editUser(u)}
                              title="Sửa thông tin"
                            >
                              ✏️ Sửa
                            </button>
                            <button
                              type="button"
                              className="btn-action btn-delete"
                              onClick={() => removeUser(u.id)}
                              title="Xóa người dùng"
                            >
                              🗑️ Xóa
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan="7" className="empty-state">
                        <div className="empty-content">
                          <span className="empty-icon">🔍</span>
                          <p className="empty-text">
                            Không tìm thấy người dùng nào phù hợp với từ khóa "<strong>{keyword}</strong>"
                          </p>
                        </div>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          )}

          {/* Modal chỉnh sửa người dùng */}
          {editing && (
            <div className="modal-overlay" onClick={() => setEditing(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">
                    <span>✏️</span> Cập nhật người dùng #{editing.id}
                  </h3>
                  <button
                    type="button"
                    className="modal-close"
                    onClick={() => setEditing(null)}
                    title="Đóng"
                  >
                    ×
                  </button>
                </div>

                <form onSubmit={saveUser}>
                  <div className="modal-body">
                    <div className="form-grid">
                      <div className="form-group">
                        <label htmlFor="edit-name">
                          Họ và tên (Name) <span className="req">*</span>
                        </label>
                        <input
                          id="edit-name"
                          type="text"
                          required
                          value={editing.name}
                          onChange={(e) => handleEditChange("name", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="edit-username">
                          Tên tài khoản (Username) <span className="req">*</span>
                        </label>
                        <input
                          id="edit-username"
                          type="text"
                          required
                          value={editing.username}
                          onChange={(e) => handleEditChange("username", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="edit-email">Email</label>
                        <input
                          id="edit-email"
                          type="email"
                          value={editing.email || ""}
                          onChange={(e) => handleEditChange("email", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="edit-phone">Số điện thoại</label>
                        <input
                          id="edit-phone"
                          type="text"
                          value={editing.phone || ""}
                          onChange={(e) => handleEditChange("phone", e.target.value)}
                        />
                      </div>

                      <div className="form-section-title">Thông tin Địa chỉ</div>

                      <div className="form-group">
                        <label htmlFor="edit-street">Đường / Phố (Street)</label>
                        <input
                          id="edit-street"
                          type="text"
                          value={editing.address?.street || ""}
                          onChange={(e) => handleEditChange("street", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="edit-suite">Phòng / Tòa (Suite)</label>
                        <input
                          id="edit-suite"
                          type="text"
                          value={editing.address?.suite || ""}
                          onChange={(e) => handleEditChange("suite", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="edit-city">Thành phố (City)</label>
                        <input
                          id="edit-city"
                          type="text"
                          value={editing.address?.city || ""}
                          onChange={(e) => handleEditChange("city", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label htmlFor="edit-website">Website</label>
                        <input
                          id="edit-website"
                          type="text"
                          value={editing.website || ""}
                          onChange={(e) => handleEditChange("website", e.target.value)}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="modal-actions">
                    <button
                      type="button"
                      className="btn btn-secondary"
                      onClick={() => setEditing(null)}
                    >
                      Hủy
                    </button>
                    <button type="submit" className="btn btn-primary">
                      Lưu thay đổi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ==========================================================================
       4. Component App (Gốc)
       - Quản lý toàn bộ State tập trung (State Lifting):
         + kw: Từ khóa tìm kiếm do SearchForm cập nhật
         + newUser: Người dùng mới do AddUser tạo ra
       - Truyền props và hàm callback xuống các component con
       ========================================================================== */
    function App() {
      const [kw, setKeyword] = useState("");
      const [newUser, setNewUser] = useState(null);

      return (
        <div className="app-container">
          <nav className="top-nav">
            <a href="../index.html" className="back-link">
              ← Về Hub Assignment 06
            </a>
            <span className="nav-tag">IT4409 • Bài tập React CRUD</span>
          </nav>

          <header className="app-header">
            <div className="header-content">
              <div className="header-badge">React 18 • Hooks CRUD</div>
              <h1 className="header-title">Quản lý người dùng</h1>
              <p className="header-subtitle">
                Ứng dụng Single Page Application (SPA) với Functional Components, State Lifting và REST API
              </p>
            </div>
            <div className="author-badge">
              <span className="author-name">Hà Tuấn Dũng</span>
              <span className="author-meta">MSSV: 20235299 | IT4409</span>
            </div>
          </header>

          <main className="app-main">
            <div className="toolbar">
              <SearchForm onChangeValue={setKeyword} />
              <AddUser onAdd={setNewUser} />
            </div>

            <ResultTable
              keyword={kw}
              user={newUser}
              onAdded={() => setNewUser(null)}
            />
          </main>

          <footer className="app-footer">
            <p>&copy; 2026 Hà Tuấn Dũng — 20235299 — Học phần IT4409 (Lập trình Web) | HUST</p>
          </footer>
        </div>
      );
    }

    /* Khởi tạo React 18 Root */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
